<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Dモデルサンプル</title>
  <!-- model-viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }
    model-viewer {
      width: 80%;
      height: 80%;
    }
  </style>
</head>
<body>

  <!-- 3D-->
  <model-viewer
    src="./WaterBottle.glb" 
    alt="3D"
    camera-controls>
  </model-viewer>

</body>
</html>
