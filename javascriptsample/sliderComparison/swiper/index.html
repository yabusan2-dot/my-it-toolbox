<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Swiperサンプル</title>
    <link rel="stylesheet" href="./css/swiper-bundle.min.css"/>
</head>
<body>
    <h1>Swiperサンプル</h1>
    <p>Swiperを使用したサンプルです</p>

<div class="swiper">
  <div class="swiper-wrapper">
    <!-- Slides -->
    <div class="swiper-slide"><img src="./img/slide1.jpg" alt="slide1"></div>

    <div class="swiper-slide"><img src="./img/slide2.jpg" alt="slide2"></div>

    <div class="swiper-slide"><img src="./img/slide3.jpg" alt="slide3"></div>

  </div>

</div>

<script src="./js/swiper-bundle.min.js"></script>
<script src="./js/slide.js"></script>
</body>

</html>
