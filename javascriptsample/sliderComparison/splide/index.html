<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Splideサンプル</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
</head>
<body>
    <h1>Splideサンプル</h1>
    <p>Splideを使用したサンプルです</p>

<section class="splide" aria-label="Splideの基本的なHTML">
  <div class="splide__track">
		<ul class="splide__list">
			<li class="splide__slide"><img src="./img/slide1.jpg" alt="slide1"></li>
			<li class="splide__slide"><img src="./img/slide2.jpg" alt="slide2"></li>
			<li class="splide__slide"><img src="./img/slide3.jpg" alt="slide3"></li>
		</ul>
  </div>
</section>


<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<script src="./js/slide.js"></script>
</body>

</html>
